<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASB1995</title>
    <!-- CSS の層(@layer)の優先順位を最初に決めておく(Vuetify の layers.css と同じ並び。後ろほど強い)。
         部品ごとの CSS が読み込まれる順に任せると、reset 層が部品の層より強くなることがある。 -->
    <style>
      @layer vuetify-core.reset, vuetify-core.base, vuetify-components, vuetify-overrides,
        vuetify-utilities.theme-base, vuetify-utilities.typography, vuetify-utilities.helpers,
        vuetify-utilities.theme-background, vuetify-utilities.theme-foreground,
        vuetify-final.transitions, vuetify-final.trumps;
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
