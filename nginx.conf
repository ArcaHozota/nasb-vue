server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # JS・CSS・フォント・画像は Vite が内容ハッシュ付きで出力するため長期キャッシュ
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html は毎回サーバーに確認させる(デプロイ後すぐに新しいハッシュ付きファイルを参照させるため)。
  # 「/」や未知のパスも、下の try_files・index から内部でここへ来る
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: 未知のパスは index.html に返し、vue-router に任せる
  location / {
    try_files $uri $uri/ /index.html;
  }
}
