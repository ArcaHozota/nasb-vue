events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        # index.html は毎回検証させる(デプロイのたびに新しいハッシュ付きassetを
        # 参照させるため、キャッシュさせない)
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # vite出力のハッシュ付きファイル(assets/*)は不変なので長期キャッシュしてよい
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Vue Router (history mode) 対応。存在しないパスは index.html にフォールバック
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
