server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # JS・CSS・フォント・画像は Vite が内容ハッシュ付きで出力するため長期キャッシュ
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: 未知のパスは index.html に返し、vue-router に任せる
  location / {
    try_files $uri $uri/ /index.html;
  }
}
